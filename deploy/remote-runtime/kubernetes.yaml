apiVersion: v1
kind: Namespace
metadata:
  name: anicode-runtime
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: anicode-control-plane
  namespace: anicode-runtime
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: anicode-runner
  namespace: anicode-runtime
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: anicode-egress-proxy
  namespace: anicode-runtime
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: anicode-github-control
  namespace: anicode-runtime
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: anicode-job-controller
  namespace: anicode-runtime
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  # Execution-scoped proxy URLs are held in immutable, per-Job Secrets. The controller never
  # updates, lists, or watches Secrets; cleanup uses an exact-name GET and UID-preconditioned DELETE.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: anicode-job-controller
  namespace: anicode-runtime
subjects:
  - kind: ServiceAccount
    name: anicode-control-plane
    namespace: anicode-runtime
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: anicode-job-controller
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anicode-workspaces
  namespace: anicode-runtime
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anicode-remote-runtime
  namespace: anicode-runtime
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app: anicode-remote-runtime
  template:
    metadata:
      labels:
        app: anicode-remote-runtime
    spec:
      serviceAccountName: anicode-control-plane
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: anicode-remote-runtime }
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          # CI replaces this with the signed image digest; tags are rejected by the runtime.
          image: ghcr.io/OWNER/anicode-control-plane@sha256:REPLACE_WITH_DIGEST
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "remote", "--workspace", "@anicode/core"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            # The Service is an internal backend only. A trusted ingress/gateway must terminate
            # public TLS; the NetworkPolicy below rejects every other Pod source.
            - name: ANICODE_REMOTE_TLS_MODE
              value: trusted-proxy
            - name: ANICODE_REMOTE_EXECUTION
              value: kubernetes
            - name: ANICODE_RUNTIME_NAMESPACE
              value: anicode-runtime
            - name: ANICODE_REMOTE_WORKSPACE_ROOT
              value: /workspaces
            - name: ANICODE_REMOTE_WORKER_CONCURRENCY
              value: "4"
            - name: ANICODE_WORKSPACE_PVC
              value: anicode-workspaces
            - name: ANICODE_EPHEMERAL_WORKSPACE
              value: "1"
            - name: ANICODE_RUNTIME_PROXY_URL
              value: http://anicode-egress-proxy:8080
            - name: ANICODE_RUNTIME_PROXY_CONTROL_URL
              valueFrom:
                secretKeyRef: { name: anicode-runtime-config, key: proxy-control-url }
            - name: ANICODE_RUNTIME_IMAGE
              value: ghcr.io/OWNER/anicode-runner@sha256:REPLACE_WITH_DIGEST
            - name: ANICODE_OIDC_ISSUER
              valueFrom:
                secretKeyRef: { name: anicode-runtime-config, key: oidc-issuer }
            - name: ANICODE_OIDC_AUDIENCE
              valueFrom:
                secretKeyRef: { name: anicode-runtime-config, key: oidc-audience }
            - name: ANICODE_OIDC_JWKS_URI
              valueFrom:
                secretKeyRef: { name: anicode-runtime-config, key: oidc-jwks-uri }
            - name: ANICODE_CREDENTIAL_BACKEND
              value: vault
            - name: VAULT_ADDR
              valueFrom:
                secretKeyRef: { name: anicode-runtime-config, key: vault-address }
            - name: ANICODE_VAULT_ROLE
              valueFrom:
                secretKeyRef: { name: anicode-runtime-config, key: vault-role }
            - name: ANICODE_VAULT_PREFIX
              valueFrom:
                secretKeyRef: { name: anicode-runtime-config, key: vault-prefix }
            - name: ANICODE_OIDC_TOKEN_FILE
              value: /var/run/secrets/anicode-oidc/token
            - name: ANICODE_VAULT_AUDIENCE
              value: vault
            - name: ANICODE_DATABASE_CREDENTIAL_KEY
              value: runtime:DATABASE_URL
            - name: ANICODE_PROXY_CLIENT_CREDENTIAL_KEY
              value: runtime:PROXY_CLIENT_TOKEN
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability:4318
            - name: ANICODE_OTEL_CREDENTIAL_ID
              valueFrom:
                secretKeyRef:
                  name: anicode-runtime-config
                  key: otel-credential-id
                  optional: true
            - name: OTEL_SERVICE_NAME
              value: anicode-remote-runtime
            - name: ANICODE_CONTROL_PLANE_NETWORK_ALLOW_PORTS
              value: "443,4318"
            - name: ANICODE_CONTROL_PLANE_ALLOW_PRIVATE
              value: "1"
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
            periodSeconds: 2
            failureThreshold: 30
          lifecycle:
            preStop:
              exec: { command: ["/bin/sh", "-c", "sleep 10"] }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: workload-identity, mountPath: /var/run/secrets/anicode-oidc, readOnly: true }
            - {
                name: kubernetes-api-token,
                mountPath: /var/run/secrets/kubernetes.io/serviceaccount,
                readOnly: true,
              }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "2", memory: 2Gi }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
        - name: workload-identity
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: vault
                  expirationSeconds: 600
        - name: kubernetes-api-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: https://kubernetes.default.svc
                  expirationSeconds: 600
---
apiVersion: v1
kind: Service
metadata:
  name: anicode-remote-runtime
  namespace: anicode-runtime
  annotations:
    anicode.dev/exposure-contract: trusted-tls-termination-only
spec:
  selector: { app: anicode-remote-runtime }
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Public bearer tokens may enter only through a separately operated HTTPS gateway. Label both its
# namespace and Pods as shown below after that gateway's TLS configuration has passed acceptance
# tests. The Service must never be exposed directly by a LoadBalancer/NodePort.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: remote-runtime-ingress-from-tls-gateway-only
  namespace: anicode-runtime
spec:
  podSelector:
    matchLabels: { app: anicode-remote-runtime }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { anicode.dev/remote-runtime-ingress: trusted }
          podSelector:
            matchLabels: { anicode.dev/tls-termination: "true" }
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anicode-github-control
  namespace: anicode-runtime
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: anicode-github-control }
  template:
    metadata:
      labels: { app: anicode-github-control }
    spec:
      serviceAccountName: anicode-github-control
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: anicode-github-control }
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: github-control
          image: ghcr.io/OWNER/anicode-control-plane@sha256:REPLACE_WITH_DIGEST
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "github-control", "--workspace", "@anicode/core"]
          ports:
            - { name: webhook, containerPort: 8081 }
          env:
            - { name: PORT, value: "8081" }
            - { name: ANICODE_GITHUB_WORKER_CONCURRENCY, value: "4" }
            - { name: ANICODE_CREDENTIAL_BACKEND, value: vault }
            - name: ANICODE_GITHUB_OWNER
              valueFrom:
                secretKeyRef: { name: anicode-runtime-config, key: github-owner }
            - name: ANICODE_GITHUB_REPO
              valueFrom:
                secretKeyRef: { name: anicode-runtime-config, key: github-repo }
            - name: ANICODE_GITHUB_APP_ID
              valueFrom:
                secretKeyRef: { name: anicode-runtime-config, key: github-app-id }
            - name: ANICODE_GITHUB_INSTALLATION_ID
              valueFrom:
                secretKeyRef: { name: anicode-runtime-config, key: github-installation-id }
            - name: VAULT_ADDR
              valueFrom:
                secretKeyRef: { name: anicode-runtime-config, key: vault-address }
            - name: ANICODE_VAULT_ROLE
              valueFrom:
                secretKeyRef: { name: anicode-runtime-config, key: vault-role }
            - name: ANICODE_VAULT_PREFIX
              valueFrom:
                secretKeyRef: { name: anicode-runtime-config, key: vault-prefix }
            - { name: ANICODE_OIDC_TOKEN_FILE, value: /var/run/secrets/anicode-oidc/token }
            - { name: ANICODE_VAULT_AUDIENCE, value: vault }
            - { name: ANICODE_DATABASE_CREDENTIAL_KEY, value: "runtime:DATABASE_URL" }
            - { name: ANICODE_GITHUB_PRIVATE_KEY_CREDENTIAL_KEY, value: "github:APP_PRIVATE_KEY" }
            - { name: ANICODE_GITHUB_WEBHOOK_CREDENTIAL_KEY, value: "github:WEBHOOK_SECRET" }
            - { name: OTEL_SERVICE_NAME, value: anicode-github-control }
            - name: ANICODE_OTEL_CREDENTIAL_ID
              valueFrom:
                secretKeyRef:
                  name: anicode-runtime-config
                  key: otel-credential-id
                  optional: true
            - {
                name: OTEL_EXPORTER_OTLP_ENDPOINT,
                value: "http://otel-collector.observability:4318",
              }
            - { name: ANICODE_CONTROL_PLANE_ALLOW_PRIVATE, value: "1" }
          startupProbe:
            httpGet: { path: /healthz, port: webhook }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: webhook }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: webhook }
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec: { command: ["/bin/sh", "-c", "sleep 10"] }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: workload-identity, mountPath: /var/run/secrets/anicode-oidc, readOnly: true }
          resources:
            requests: { cpu: 150m, memory: 192Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: workload-identity
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: vault
                  expirationSeconds: 600
---
apiVersion: v1
kind: Service
metadata:
  name: anicode-github-control
  namespace: anicode-runtime
spec:
  selector: { app: anicode-github-control }
  ports:
    - { name: webhook, port: 80, targetPort: webhook }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anicode-egress-proxy
  namespace: anicode-runtime
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: anicode-egress-proxy }
  template:
    metadata:
      labels: { app: anicode-egress-proxy }
    spec:
      serviceAccountName: anicode-egress-proxy
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: anicode-egress-proxy }
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: proxy
          image: ghcr.io/OWNER/anicode-control-plane@sha256:REPLACE_WITH_DIGEST
          command: ["npm", "run", "network-proxy", "--workspace", "@anicode/core"]
          ports:
            - name: proxy
              containerPort: 8080
          env:
            - { name: PORT, value: "8080" }
            - name: ANICODE_NETWORK_ALLOW_DOMAINS
              valueFrom:
                secretKeyRef: { name: anicode-runtime-config, key: network-allow-domains }
            - { name: ANICODE_NETWORK_ALLOW_PORTS, value: "80,443" }
            - { name: ANICODE_NETWORK_ALLOW_PRIVATE, value: "0" }
            - { name: ANICODE_CREDENTIAL_BACKEND, value: vault }
            - name: VAULT_ADDR
              valueFrom:
                secretKeyRef: { name: anicode-runtime-config, key: vault-address }
            - name: ANICODE_VAULT_ROLE
              valueFrom:
                secretKeyRef: { name: anicode-runtime-config, key: vault-role }
            - name: ANICODE_VAULT_PREFIX
              valueFrom:
                secretKeyRef: { name: anicode-runtime-config, key: vault-prefix }
            - { name: ANICODE_OIDC_TOKEN_FILE, value: /var/run/secrets/anicode-oidc/token }
            - { name: ANICODE_VAULT_AUDIENCE, value: vault }
            - { name: ANICODE_PROXY_CLIENT_CREDENTIAL_KEY, value: "runtime:PROXY_CLIENT_TOKEN" }
            - { name: ANICODE_PROXY_MAX_REQUEST_BYTES, value: "8388608" }
            - { name: ANICODE_PROXY_MAX_RESPONSE_BYTES, value: "33554432" }
            - { name: ANICODE_PROXY_MAX_TUNNEL_MS, value: "600000" }
            - { name: ANICODE_PROXY_MAX_TUNNEL_BYTES, value: "268435456" }
            - { name: ANICODE_PROXY_MAX_TUNNELS, value: "128" }
          readinessProbe:
            tcpSocket: { port: proxy }
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket: { port: proxy }
            periodSeconds: 10
            timeoutSeconds: 2
          lifecycle:
            preStop:
              exec: { command: ["/bin/sh", "-c", "sleep 5"] }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: workload-identity, mountPath: /var/run/secrets/anicode-oidc, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
        - name: workload-identity
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: vault
                  expirationSeconds: 600
---
apiVersion: v1
kind: Service
metadata:
  name: anicode-egress-proxy
  namespace: anicode-runtime
spec:
  selector: { app: anicode-egress-proxy }
  ports:
    - name: proxy
      port: 8080
      targetPort: proxy
---
# Every runner starts with zero egress. This also blocks binaries that ignore proxy env vars.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runner-deny-all-egress
  namespace: anicode-runtime
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: anicode-runner
  policyTypes: ["Ingress", "Egress"]
---
# Only jobs explicitly labelled network=proxy can reach proxy Pods. The control plane resolves
# the Service and injects a pinned Pod/IP URL; runner namespaces receive no DNS egress, closing
# both direct TCP/UDP and DNS-tunnel bypasses for arbitrary binaries.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runner-proxy-egress
  namespace: anicode-runtime
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: anicode-runner
      anicode.dev/network: proxy
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: anicode-egress-proxy }
      ports:
        - { protocol: TCP, port: 8080 }
---
# Proxy pods alone may reach public HTTP(S); the application proxy still enforces DNS/IP/domain policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: proxy-public-egress
  namespace: anicode-runtime
spec:
  podSelector:
    matchLabels: { app: anicode-egress-proxy }
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        - { protocol: TCP, port: 80 }
        - { protocol: TCP, port: 443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: proxy-ingress-from-runners-only
  namespace: anicode-runtime
spec:
  podSelector:
    matchLabels: { app: anicode-egress-proxy }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: anicode-runner
              anicode.dev/network: proxy
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: anicode-remote-runtime
  namespace: anicode-runtime
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: anicode-remote-runtime }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: anicode-egress-proxy
  namespace: anicode-runtime
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: anicode-egress-proxy }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: anicode-github-control
  namespace: anicode-runtime
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: anicode-github-control }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: anicode-remote-runtime
  namespace: anicode-runtime
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: anicode-remote-runtime
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: anicode-egress-proxy
  namespace: anicode-runtime
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: anicode-egress-proxy
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: anicode-github-control
  namespace: anicode-runtime
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: anicode-github-control
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }

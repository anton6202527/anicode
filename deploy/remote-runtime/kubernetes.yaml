apiVersion: v1
kind: Namespace
metadata:
  name: anicode-runtime
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: anicode-control-plane
  namespace: anicode-runtime
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: anicode-runner
  namespace: anicode-runtime
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: anicode-job-controller
  namespace: anicode-runtime
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: anicode-job-controller
  namespace: anicode-runtime
subjects:
  - kind: ServiceAccount
    name: anicode-control-plane
    namespace: anicode-runtime
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: anicode-job-controller
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anicode-workspaces
  namespace: anicode-runtime
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anicode-remote-runtime
  namespace: anicode-runtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app: anicode-remote-runtime
  template:
    metadata:
      labels:
        app: anicode-remote-runtime
    spec:
      serviceAccountName: anicode-control-plane
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          # CI replaces this with the signed image digest; tags are rejected by the runtime.
          image: ghcr.io/OWNER/anicode-control-plane@sha256:REPLACE_WITH_DIGEST
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "remote", "--workspace", "@anicode/core"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: ANICODE_REMOTE_EXECUTION
              value: kubernetes
            - name: ANICODE_RUNTIME_NAMESPACE
              value: anicode-runtime
            - name: ANICODE_REMOTE_WORKSPACE_ROOT
              value: /workspaces
            - name: ANICODE_WORKSPACE_PVC
              value: anicode-workspaces
            - name: ANICODE_EPHEMERAL_WORKSPACE
              value: "1"
            - name: ANICODE_RUNTIME_PROXY_URL
              value: http://anicode-egress-proxy:8080
            - name: ANICODE_RUNTIME_IMAGE
              value: ghcr.io/OWNER/anicode-runner@sha256:REPLACE_WITH_DIGEST
            - name: ANICODE_OIDC_ISSUER
              valueFrom:
                secretKeyRef: { name: anicode-runtime-config, key: oidc-issuer }
            - name: ANICODE_OIDC_AUDIENCE
              valueFrom:
                secretKeyRef: { name: anicode-runtime-config, key: oidc-audience }
            - name: ANICODE_OIDC_JWKS_URI
              valueFrom:
                secretKeyRef: { name: anicode-runtime-config, key: oidc-jwks-uri }
            - name: ANICODE_CREDENTIAL_BACKEND
              value: vault
            - name: VAULT_ADDR
              valueFrom:
                secretKeyRef: { name: anicode-runtime-config, key: vault-address }
            - name: ANICODE_VAULT_ROLE
              valueFrom:
                secretKeyRef: { name: anicode-runtime-config, key: vault-role }
            - name: ANICODE_VAULT_PREFIX
              valueFrom:
                secretKeyRef: { name: anicode-runtime-config, key: vault-prefix }
            - name: ANICODE_OIDC_TOKEN_FILE
              value: /var/run/secrets/anicode-oidc/token
            - name: ANICODE_VAULT_AUDIENCE
              value: vault
            - name: ANICODE_DATABASE_CREDENTIAL_KEY
              value: runtime:DATABASE_URL
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability:4318
            - name: OTEL_SERVICE_NAME
              value: anicode-remote-runtime
            - name: ANICODE_CONTROL_PLANE_NETWORK_ALLOW_DOMAINS
              value: otel-collector.observability
            - name: ANICODE_CONTROL_PLANE_NETWORK_ALLOW_PORTS
              value: "4318"
            - name: ANICODE_CONTROL_PLANE_ALLOW_PRIVATE
              value: "1"
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: workload-identity, mountPath: /var/run/secrets/anicode-oidc, readOnly: true }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "2", memory: 2Gi }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
        - name: workload-identity
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: vault
                  expirationSeconds: 600
---
apiVersion: v1
kind: Service
metadata:
  name: anicode-remote-runtime
  namespace: anicode-runtime
spec:
  selector: { app: anicode-remote-runtime }
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anicode-egress-proxy
  namespace: anicode-runtime
spec:
  replicas: 2
  selector:
    matchLabels: { app: anicode-egress-proxy }
  template:
    metadata:
      labels: { app: anicode-egress-proxy }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: proxy
          image: ghcr.io/OWNER/anicode-control-plane@sha256:REPLACE_WITH_DIGEST
          command: ["npm", "run", "network-proxy", "--workspace", "@anicode/core"]
          ports:
            - name: proxy
              containerPort: 8080
          env:
            - { name: PORT, value: "8080" }
            - name: ANICODE_NETWORK_ALLOW_DOMAINS
              valueFrom:
                secretKeyRef: { name: anicode-runtime-config, key: network-allow-domains }
            - { name: ANICODE_NETWORK_ALLOW_PORTS, value: "80,443" }
            - { name: ANICODE_NETWORK_ALLOW_PRIVATE, value: "0" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: anicode-egress-proxy
  namespace: anicode-runtime
spec:
  selector: { app: anicode-egress-proxy }
  ports:
    - name: proxy
      port: 8080
      targetPort: proxy
---
# Every runner starts with zero egress. This also blocks binaries that ignore proxy env vars.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runner-deny-all-egress
  namespace: anicode-runtime
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: anicode-runner
  policyTypes: ["Ingress", "Egress"]
---
# Only jobs explicitly labelled network=proxy can reach proxy Pods. The control plane resolves
# the Service and injects a pinned Pod/IP URL; runner namespaces receive no DNS egress, closing
# both direct TCP/UDP and DNS-tunnel bypasses for arbitrary binaries.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runner-proxy-egress
  namespace: anicode-runtime
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: anicode-runner
      anicode.dev/network: proxy
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: anicode-egress-proxy }
      ports:
        - { protocol: TCP, port: 8080 }
---
# Proxy pods alone may reach public HTTP(S); the application proxy still enforces DNS/IP/domain policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: proxy-public-egress
  namespace: anicode-runtime
spec:
  podSelector:
    matchLabels: { app: anicode-egress-proxy }
  policyTypes: ["Egress"]
  egress:
    - ports:
        - { protocol: TCP, port: 80 }
        - { protocol: TCP, port: 443 }
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: anicode-remote-runtime
  namespace: anicode-runtime
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: anicode-remote-runtime
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }

project_id = "anicode"

[functions.anicode-chat]
# Modern Supabase signing keys and strict user claims are verified inside the function with
# auth.getClaims(). Keep this off until the platform verifier is canaried with this project's ES256
# tokens; current Supabase guidance for asymmetric keys is contradictory.
verify_jwt = false

# Keep local streaming pipes/background quota settlement alive after the Response is returned.
[edge_runtime]
policy = "per_worker"

name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 合并到 main 时：有待发布的 changeset 就开「Version Packages」PR；
  # 该 PR 合并后再次触发，此时直接 publish 到 npm。
  npm:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: anicode_test
          POSTGRES_USER: anicode
          POSTGRES_PASSWORD: anicode-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anicode -d anicode_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANICODE_TEST_DATABASE_URL: postgresql://anicode:anicode-test-only@127.0.0.1:5432/anicode_test
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Run complete release gate
        run: npm run verify:release

      - name: Create Release PR or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: npm run version
          publish: npm run release
        env:
          # GitHub supplies this per job; npm publish uses trusted publishing (OIDC), not a stored token.
          GITHUB_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: "true"

  # Release assets are built only after the tagged commit passes the same gate as npm publishing.
  validate-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: anicode_test
          POSTGRES_USER: anicode
          POSTGRES_PASSWORD: anicode-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anicode -d anicode_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANICODE_TEST_DATABASE_URL: postgresql://anicode:anicode-test-only@127.0.0.1:5432/anicode_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Validate tagged release candidate
        run: npm run verify:release

  # 发布 GitHub Release 时：构建 .vsix 并作为 Release 资产上传。
  vsix:
    if: github.event_name == 'release'
    needs: validate-release
    name: vsix (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: windows-latest, target: win32-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Set release version
        run: node scripts/set-release-version.mjs "${{ github.event.release.tag_name }}"

      - name: Package VSCode extension
        run: >-
          npm exec --workspace anicode-vscode -- vsce package
          --no-dependencies
          --target "${{ matrix.target }}"
          -o "packages/vscode/anicode-${{ matrix.target }}.vsix"

      - name: Generate VSIX checksum
        run: >-
          node scripts/write-sha256s.mjs
          "packages/vscode/anicode-${{ matrix.target }}-SHA256SUMS.txt"
          packages/vscode .vsix

      - name: Attest VSIX build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-checksums: packages/vscode/anicode-${{ matrix.target }}-SHA256SUMS.txt

      - name: Upload .vsix to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            packages/vscode/anicode-${{ matrix.target }}.vsix
            packages/vscode/anicode-${{ matrix.target }}-SHA256SUMS.txt

  desktop:
    if: github.event_name == 'release'
    needs: validate-release
    name: desktop (${{ matrix.platform }})
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              os: macos-latest,
              platform: mac,
              args: "--mac --arm64 --x64 -c.forceCodeSigning=true",
              signed: "true",
            }
          - {
              os: windows-latest,
              platform: windows,
              args: "--win --x64 -c.forceCodeSigning=true",
              signed: "true",
            }
          - { os: ubuntu-latest, platform: linux, args: "--linux --x64", signed: "false" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MACOS_CSC_LINK || secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MACOS_CSC_KEY_PASSWORD || secrets.WINDOWS_CSC_KEY_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Require release signing credentials
        if: matrix.signed == 'true'
        shell: bash
        run: |
          test -n "$CSC_LINK" || { echo "Missing code-signing certificate" >&2; exit 1; }
          test -n "$CSC_KEY_PASSWORD" || { echo "Missing certificate password" >&2; exit 1; }
          if [ "${{ matrix.platform }}" = "mac" ]; then
            test -n "$APPLE_API_KEY_BASE64" || { echo "Missing Apple notarization API key" >&2; exit 1; }
            test -n "$APPLE_API_KEY_ID" || { echo "Missing Apple API key ID" >&2; exit 1; }
            test -n "$APPLE_API_ISSUER" || { echo "Missing Apple API issuer" >&2; exit 1; }
          fi

      - name: Prepare Apple notarization key
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Set release version
        run: node scripts/set-release-version.mjs "${{ github.event.release.tag_name }}"

      - name: Build signed desktop installers
        run: npm run dist --workspace @anicode/app -- ${{ matrix.args }} --publish never

      - name: Generate desktop checksums
        run: >-
          node scripts/write-sha256s.mjs
          "packages/app/release/anicode-${{ matrix.platform }}-SHA256SUMS.txt"
          packages/app/release .dmg .zip .exe .AppImage .yml .blockmap

      - name: Attest desktop build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-checksums: packages/app/release/anicode-${{ matrix.platform }}-SHA256SUMS.txt

      - name: Upload desktop release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          fail_on_unmatched_files: true
          files: |
            packages/app/release/*.{dmg,zip,exe,AppImage,yml,blockmap}
            packages/app/release/anicode-${{ matrix.platform }}-SHA256SUMS.txt

name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 合并到 main 时：有待发布的 changeset 就开「Version Packages」PR；
  # 该 PR 合并后再次触发，此时直接 publish 到 npm。
  npm:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Create Release PR or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: npm run version
          publish: npm run release
        env:
          # GitHub supplies this per job; npm publish uses trusted publishing (OIDC), not a stored token.
          GITHUB_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: "true"

  # 发布 GitHub Release 时：构建 .vsix 并作为 Release 资产上传。
  vsix:
    if: github.event_name == 'release'
    name: vsix (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: windows-latest, target: win32-x64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Package VSCode extension
        run: >-
          npx vsce package
          --no-dependencies
          --target "${{ matrix.target }}"
          -o "packages/vscode/anicode-${{ matrix.target }}.vsix"

      - name: Upload .vsix to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: packages/vscode/anicode-${{ matrix.target }}.vsix

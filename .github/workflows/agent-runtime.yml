name: Agent Runtime Delivery

on:
  workflow_dispatch:
    inputs:
      run_eval_selftest:
        description: Run the 100+ offline task integrity matrix
        required: false
        default: true
        type: boolean
  workflow_call:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write
  packages: write

concurrency:
  group: agent-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify generated OpenAPI SDK contract
        run: npm run codegen:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test runtime and protocol contracts
        run: npm test
      - name: Archive runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-runtime-evidence-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .anicode/**/*.json
            .anicode/**/*.jsonl
            packages/eval/**/*.json
      - name: Package provenance subject
        if: success()
        run: |
          tar -czf anicode-runtime-evidence.tgz \
            packages/sdk/src/generated.ts \
            docs/architecture \
            deploy/remote-runtime
      - name: Sign build provenance with GitHub OIDC
        if: success()
        uses: actions/attest@v4
        with:
          subject-path: anicode-runtime-evidence.tgz

  build-images:
    needs: verify-delivery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: anicode-control-plane
            target: control-plane
          - image: anicode-runner
            target: runner
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - name: Require a reviewed digest-pinned base image
        env:
          BASE_IMAGE: ${{ vars.ANICODE_NODE_BASE_IMAGE }}
        run: |
          printf '%s' "$BASE_IMAGE" | grep -Eq '^node:24-bookworm-slim@sha256:[0-9a-f]{64}$'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/remote-runtime/Dockerfile
          target: ${{ matrix.target }}
          build-args: BASE_IMAGE=${{ vars.ANICODE_NODE_BASE_IMAGE }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Sign image provenance with GitHub OIDC
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

name: Eval (nightly)

# 每晚用真实模型跑完整 eval 矩阵，输出 JSON 工件并与提交在库的基线比较；
# 通过率跌超容忍度（默认 6 个百分点 ≈ 16 任务容 1 个偶发）则失败告警。
# 模型凭证只通过 GitHub OIDC 换取 Vault 短期身份；fork/未启用环境不运行。
on:
  schedule:
    - cron: "0 18 * * *" # 02:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Require an enabled, reviewable production gate
        env:
          ENABLED: ${{ vars.ANICODE_EVAL_ENABLED }}
          MODEL: ${{ vars.ANICODE_EVAL_MODEL }}
          TRUSTED_KEYS: ${{ vars.ANICODE_EVAL_BASELINE_TRUSTED_KEYS }}
          ANICODE_EVAL_BASELINE_TRUSTED_KEYS: ${{ vars.ANICODE_EVAL_BASELINE_TRUSTED_KEYS }}
        run: |
          test "$ENABLED" = "true" || { echo "ANICODE_EVAL_ENABLED must be true" >&2; exit 1; }
          test -n "$MODEL" || { echo "ANICODE_EVAL_MODEL is required" >&2; exit 1; }
          test -n "$TRUSTED_KEYS" || { echo "ANICODE_EVAL_BASELINE_TRUSTED_KEYS is required" >&2; exit 1; }
          test -f packages/eval/baseline.json || { echo "Reviewed eval baseline is missing" >&2; exit 1; }
          test -f packages/eval/baseline.manifest.json || { echo "Reviewed eval baseline manifest is missing" >&2; exit 1; }
          npm run eval:baseline --workspace @anicode/eval -- verify \
            --baseline packages/eval/baseline.json \
            --manifest packages/eval/baseline.manifest.json \
            --expect-model "$MODEL" --expect-suite offline --expect-trials 3

  eval:
    needs: readiness
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      # ubuntu-latest 自带 python3 与 go；缺了对应任务会被 harness 跳过而非失败。

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          npm ci

      - name: Run eval
        env:
          ANICODE_CREDENTIAL_BACKEND: vault
          VAULT_ADDR: ${{ vars.ANICODE_VAULT_ADDR }}
          VAULT_NAMESPACE: ${{ vars.ANICODE_VAULT_NAMESPACE }}
          ANICODE_VAULT_ROLE: ${{ vars.ANICODE_VAULT_ROLE }}
          ANICODE_VAULT_PREFIX: ${{ vars.ANICODE_VAULT_PREFIX || 'anicode' }}
          ANICODE_CREDENTIAL_KEYS: ${{ vars.ANICODE_CREDENTIAL_KEYS }}
          ANICODE_EVAL_BASELINE_TRUSTED_KEYS: ${{ vars.ANICODE_EVAL_BASELINE_TRUSTED_KEYS }}
          ANICODE_NETWORK_ALLOW_DOMAINS: ${{ vars.ANICODE_EVAL_NETWORK_ALLOW_DOMAINS }}
        run: >-
          npm run eval --workspace @anicode/eval --
          --model "${{ vars.ANICODE_EVAL_MODEL }}"
          --trials 3
          --baseline packages/eval/baseline.json
          --baseline-manifest packages/eval/baseline.manifest.json
          --json eval-result.json

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eval-result
          path: eval-result.json
          if-no-files-found: ignore

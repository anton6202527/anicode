name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Merge queue 创建临时 merge group；同一组 required checks 必须在该 SHA 上重跑。
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# 同一分支的旧运行取消，节省 CI 时间。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4

  workflow-contract:
    name: workflow contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: false
      - name: Validate GitHub Actions context and shell contracts
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  quality:
    name: quality (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Guard the minimum, the pinned release LTS, and the newest stable Node release.
        # `current` is resolved from the official Node distribution on every CI run.
        node: ["22.15.0", "24", "current"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: anicode_test
          POSTGRES_USER: anicode
          POSTGRES_PASSWORD: anicode-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anicode -d anicode_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANICODE_TEST_DATABASE_URL: postgresql://anicode:anicode-test-only@127.0.0.1:5432/anicode_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Production dependency audit
        if: matrix.node == '24'
        run: npm audit --omit=dev --audit-level=high

      - name: Build-tool vulnerability audit
        if: matrix.node == '24'
        run: npm run audit:build

      - name: Registry signature and provenance audit
        if: matrix.node == '24'
        run: npm audit signatures

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Generated API contract is current
        run: npm run codegen:check

      - name: Test
        run: npm test

      - name: Published CLI compatibility smoke test
        if: matrix.node == 'current'
        run: npm run smoke:cli

  # Native terminal, keychain and packaging behavior must not be inferred from Linux-only CI.
  # PostgreSQL integration remains in the Ubuntu job above; these jobs exercise the portable path.
  quality-platform:
    name: quality (${{ matrix.os }}, node 24)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run codegen:check
      - run: npm test
      - run: npm run build:cli
      - run: npm run build:app
      - run: npm run build:vscode

  build:
    name: build artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      # 只做可移植的 bundle 构建；Electron 安装包（签名/多平台打包）仍不在每次 PR 上跑。
      - name: Build CLI
        run: npm run build:cli

      - name: Build Electron app
        run: npm run build:app

      - name: Build VSCode extension
        run: npm run build:vscode

      - name: Bundle size budgets
        run: npm run size:check

      - name: Published CLI install smoke test
        run: npm run smoke:cli

name: Real Repository Eval

on:
  schedule:
    # Weekday canary and Sunday full 280-task matrix.
    - cron: "30 18 * * 1-5"
    - cron: "30 18 * * 0"
  workflow_dispatch:
    inputs:
      limit:
        description: Number of real tasks to run (280 for the full matrix)
        required: false
        default: "40"

permissions:
  contents: read

concurrency:
  group: real-eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  catalog-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify the pinned 280-task catalog
        run: node --import tsx --test packages/eval/src/real-repo.test.ts

  plan:
    runs-on: ubuntu-latest
    outputs:
      limit: ${{ steps.plan.outputs.limit }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      shards: ${{ steps.plan.outputs.shards }}
      baseline: ${{ steps.plan.outputs.baseline }}
    steps:
      - id: plan
        env:
          REQUESTED_LIMIT: ${{ inputs.limit || '40' }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          limit="$REQUESTED_LIMIT"
          if [ "$SCHEDULE" = "30 18 * * 0" ]; then limit=280; fi
          case "$limit" in (*[!0-9]*|'') echo "limit must be an integer" >&2; exit 1;; esac
          if [ "$limit" -lt 1 ] || [ "$limit" -gt 280 ]; then
            echo "limit must be between 1 and 280" >&2
            exit 1
          fi
          if [ "$limit" -gt 80 ]; then shard_count=20; else shard_count=4; fi
          shards="$(node -e 'const n=Number(process.argv[1]);process.stdout.write(JSON.stringify(Array.from({length:n},(_,i)=>i)))' "$shard_count")"
          {
            echo "limit=$limit"
            echo "shard_count=$shard_count"
            echo "shards=$shards"
            echo "baseline=packages/eval/baselines/real-$limit.json"
          } >> "$GITHUB_OUTPUT"

  readiness:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require production credentials, runtime and reviewed baseline
        env:
          ENABLED: ${{ vars.ANICODE_REAL_EVAL_ENABLED }}
          MODEL: ${{ vars.ANICODE_EVAL_MODEL }}
          VAULT_ADDR: ${{ vars.ANICODE_VAULT_ADDR }}
          VAULT_ROLE: ${{ vars.ANICODE_VAULT_ROLE }}
          RUNTIME_IMAGE: ${{ vars.ANICODE_EVAL_RUNTIME_IMAGE }}
          BASELINE: ${{ needs.plan.outputs.baseline }}
        run: |
          test "$ENABLED" = "true" || { echo "ANICODE_REAL_EVAL_ENABLED must be true" >&2; exit 1; }
          test -n "$MODEL" || { echo "ANICODE_EVAL_MODEL is required" >&2; exit 1; }
          test -n "$VAULT_ADDR" || { echo "ANICODE_VAULT_ADDR is required" >&2; exit 1; }
          test -n "$VAULT_ROLE" || { echo "ANICODE_VAULT_ROLE is required" >&2; exit 1; }
          test -n "$RUNTIME_IMAGE" || { echo "ANICODE_EVAL_RUNTIME_IMAGE is required" >&2; exit 1; }
          test -f "$BASELINE" || { echo "Reviewed real-eval baseline is missing: $BASELINE" >&2; exit 1; }

  # Credentials come from workload identity/Vault. The label must target an ARC ephemeral scale set
  # configured to forward runner diagnostics before Pod deletion.
  real-eval-shard:
    needs: [catalog-integrity, plan, readiness]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: [self-hosted, anicode-ephemeral-eval]
    timeout-minutes: 660
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Run real SWE-bench shard
        env:
          ANICODE_CREDENTIAL_BACKEND: vault
          VAULT_ADDR: ${{ vars.ANICODE_VAULT_ADDR }}
          VAULT_NAMESPACE: ${{ vars.ANICODE_VAULT_NAMESPACE }}
          ANICODE_VAULT_ROLE: ${{ vars.ANICODE_VAULT_ROLE }}
          ANICODE_VAULT_PREFIX: ${{ vars.ANICODE_VAULT_PREFIX || 'anicode' }}
          ANICODE_CREDENTIAL_KEYS: ${{ vars.ANICODE_CREDENTIAL_KEYS }}
          ANICODE_NETWORK_ALLOW_DOMAINS: ${{ vars.ANICODE_EVAL_NETWORK_ALLOW_DOMAINS }}
          ANICODE_EXECUTION_BACKEND: container
          ANICODE_RUNTIME_IMAGE: ${{ vars.ANICODE_EVAL_RUNTIME_IMAGE }}
          ANICODE_CONTAINER_NETWORK: ${{ vars.ANICODE_EVAL_CONTAINER_NETWORK }}
          ANICODE_CONTAINER_PROXY_URL: ${{ vars.ANICODE_EVAL_CONTAINER_PROXY_URL }}
          ANICODE_EVAL_STATE_DIR: .anicode/eval-${{ matrix.shard }}
        run: >-
          npm run eval --
          --suite real
          --model "${{ vars.ANICODE_EVAL_MODEL }}"
          --limit "${{ needs.plan.outputs.limit }}"
          --shard-index "${{ matrix.shard }}"
          --shard-count "${{ needs.plan.outputs.shard_count }}"
          --concurrency 2
          --defer-gate
          --json "real-eval-${{ matrix.shard }}.json"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: real-eval-shard-${{ matrix.shard }}
          path: real-eval-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: [plan, real-eval-shard]
    if: ${{ always() && vars.ANICODE_REAL_EVAL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: real-eval-shard-*
          path: real-eval-shards
      - name: Merge shards and apply the quality gate
        run: >-
          npm run eval:merge --workspace @anicode/eval --
          --input real-eval-shards
          --output real-eval.json
          --baseline "${{ needs.plan.outputs.baseline }}"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: real-eval-${{ github.run_id }}
          path: |
            real-eval.json
          if-no-files-found: warn
          retention-days: 90
